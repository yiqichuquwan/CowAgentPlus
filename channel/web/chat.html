    <!-- Apply theme/lang before first paint to avoid flash of unstyled content.
         This runs synchronously in <head> so the correct class is on <html>
         before any CSS or body rendering occurs. -->
    <script>
    // Map an arbitrary locale string (zh-CN, en-US, fr ...) to 'zh' / 'zh-Hant' / 'en',
    // or '' when unrecognized so callers can fall through to the next source.
    window.__cowNormalizeLang__ = function(raw) {
        if (!raw) return '';
        var v = String(raw).trim().toLowerCase().replace('_', '-');
        if (v === 'auto') return '';
        // Handle Traditional Chinese variants first (more specific)
        if (v === 'zh-hant' || v.indexOf('zh-hant-') === 0 || v === 'zh-tw' || v === 'zh-hk') return 'zh-Hant';
        // Then Simplified Chinese
        if (v.indexOf('zh') === 0) return 'zh';
        if (v.indexOf('en') === 0) return 'en';
        return '';
    };
    // Resolve the console language by priority:
    //   user choice (localStorage) -> backend-detected -> browser -> 'zh'.
    window.__cowResolveLang__ = function() {
        return window.__cowNormalizeLang__(localStorage.getItem('cow_lang'))
            || window.__cowNormalizeLang__(window.__COW_DEFAULT_LANG__)
            || window.__cowNormalizeLang__(navigator.language || (navigator.languages && navigator.languages[0]))
            || 'zh';
    };
    (function() {
        // Backend-resolved default language (from cow_lang config / auto-detect).
        window.__COW_DEFAULT_LANG__ = '{{COW_DEFAULT_LANG}}';
        var theme = localStorage.getItem('cow_theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('lang', window.__cowResolveLang__());
    })();
    </script>
    <script>
    // Swap to the English manifest so the installed icon/home-screen label is
    // localized. Runs in <head> so the correct manifest is in place before the
    // browser evaluates installability.
    (function() {
        var link = document.getElementById('pwa-manifest');
        if (link && window.__cowResolveLang__() === 'en') {
            link.href = '/manifest.en.webmanifest';
        }
    })();

         defaultAgentId, which is a `let` declared here. Loading this later

         on the spot - taking the restored session, and so the visible
         conversation history, with it. -->

    <!-- boot before workspace.js, which is where console.js used to sit:
         applyI18n() probes for relocalizeWorkspacePanel with a typeof guard,
         and it has always run before workspace.js defined it. -->
    <script defer src="/assets/js/boot.js"></script>

    <script defer src="/assets/js/workspace.js"></script>

    <!-- PWA service worker. Registered here (not from boot.js) so a hard reload
         that wipes boot.js still re-registers the worker on first load. The
         update prompt stays in boot.js — it needs the i18n + UI modules. -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .catch(err => console.warn('[PWA] service worker registration failed:', err));
        });
    }
